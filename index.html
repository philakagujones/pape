<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f5f1" />
    <meta
      name="description"
      content="Build wealth with intention. A private, local-first capital allocation and financial planning workspace."
    />
    <title>pape. — Build wealth with intention.</title>
    <link rel="stylesheet" href="style.css" />
    <script src="planner.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a href="#overview" class="brand" aria-label="Pape overview"
          >pape<span>.</span></a
        >
        <div class="workspace-label">PERSONAL WORKSPACE</div>
        <nav id="navigation" aria-label="Main navigation"></nav>
        <div class="sidebar-bottom">
          <div class="local-note">
            <span class="status-dot"></span> On this device only
          </div>
          <p>Your plan. Your pace.</p>
          <button class="settings-button" data-action="settings">
            <span class="avatar" id="avatar">P</span
            ><span id="profile-name">Your workspace</span><span>↗</span>
          </button>
        </div>
      </aside>
      <main id="main" tabindex="-1">
        <header class="topbar">
          <span id="breadcrumb">Workspace / Overview</span>
          <div>
            <span class="currency-label">CAD workspace</span
            ><button
              class="icon-button"
              data-action="settings"
              aria-label="Open settings"
            >
              ⚙
            </button>
          </div>
        </header>
        <div id="storage-alert" class="alert hidden" role="alert"></div>
        <div id="page"></div>
        <footer class="page-footer">
          <span
            >pape. <span class="muted">Build wealth with intention.</span></span
          ><span>Private by design · No bank connections</span>
        </footer>
      </main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <form id="editor">
        <div class="dialog-header">
          <h2 id="dialog-title"></h2>
          <button
            type="button"
            class="icon-button"
            data-action="close"
            aria-label="Close dialog"
          >
            ✕
          </button>
        </div>
        <div id="dialog-body"></div>
        <p id="form-error" class="form-error" role="alert"></p>
        <div id="dialog-actions" class="dialog-actions"></div>
      </form>
    </dialog>
    <input
      type="file"
      id="import-file"
      accept="application/json,.json"
      hidden
    />
    <div id="toast" role="status" class="toast hidden"></div>
  </body>
</html>
